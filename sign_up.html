<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images\message-square-code.png">
    <link rel="stylesheet" href="sign_up.css">
    <title>Document</title>
</head>
<body>
    <header>
    <img src="images\notebook-pen.png">
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Community</a>
            <button type="button">Get Started</button>
        </nav>
    </header>
 <main>
     <h1>Sign up for free</h1><br>
     <form>
      <fieldset>
        <div>
            <label for="username">Username</label><br>
            <input type="text" id="username" name="username">
        </div>

        <div>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" placeholder="you@gmail.com">
      </div>

      <div>
        <label for="password">Password</label><br>
        <input type="password" id="password" name="password">
    </div>

    <div>
        <label for="password_confirm">Password confirmation</label><br>
        <input type="password" id="password_confirm" name="password_confirm">
    </div>
      </fieldset>
      </form>
      <h2>Support us!</h2>
      <p>The Odin project is funded by the community. Join us in empowering <br> learners the globe by supporting the Odin project!</p>
      <div>
      <button type="button">Learn More</button>
      <button type="button" class="primary">Donate now-></button>
      </div>
      
 </main>
 <footer>
    <h3>THE ODIN PROJECT</h3>
    <P> High quality coding education maintained by an open source community.</P>
 </footer>

</body>
</html>
